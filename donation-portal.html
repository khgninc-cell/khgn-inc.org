<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Portal - KHGN Inc.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --walnut:#2B211A; --walnut-deep:#1C140F; --parchment:#EDE0C8; --parchment-dim:#E0D0AC;
            --ink:#221A12; --brass:#B08D57; --brass-bright:#D4AF6A; --rust:#A63D2F; --rust-bright:#C2503F;
            --sage:#6B8A5C; --sage-bright:#82A671; --line:#4A392A;
        }
        body {
            font-family: 'Public Sans', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--walnut);
            color: var(--parchment);
        }
        .site-nav {
            background: var(--walnut-deep);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .site-nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            min-height: 68px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .site-nav-brand {
            color: var(--brass-bright);
            text-decoration: none;
            font-family: 'Rye', serif;
            font-weight: 400;
            font-size: 22px;
            white-space: nowrap;
        }
        .site-nav-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .site-nav-links a {
            color: var(--parchment);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .site-nav-links a:hover {
            color: var(--brass-bright);
        }
        .site-nav-toggle {
            display: none;
            margin-left: auto;
            padding: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .site-nav-toggle-bar {
            display: block;
            width: 24px;
            height: 3px;
            margin: 4px 0;
            border-radius: 999px;
            background: var(--brass-bright);
        }
        .page-index .site-nav-links a[href="index.html"],
        .page-groups .site-nav-links a[href="socialmedia.html"],
        .page-recruiting .site-nav-links a[href="recruiting.html"],
        .page-donation .site-nav-links a[href="donation-portal.html"],
        .page-training .site-nav-links a[href="training.html"],
        .page-games .site-nav-links a[href="game-portal.html"] {
            color: var(--brass-bright);
            border-bottom-color: var(--brass);
        }

        @media (max-width: 700px) {
            .site-nav-inner { flex-wrap: wrap; padding: 12px 20px; min-height: 0; }
            .site-nav-toggle { display: block; }
            .site-nav-links { display: none; width: 100%; margin-left: 0; flex-direction: column; align-items: flex-start; gap: 0; padding: 8px 0 4px; }
            .site-nav.is-open .site-nav-links { display: flex; }
            .site-nav-links a { width: 100%; padding: 10px 0; }
        }

        .content-container {
            max-width: 700px;
            margin: 60px auto;
            background: var(--parchment);
            color: var(--ink);
            padding: 40px 30px;
            border-radius: 12px;
            border-top: 4px solid var(--brass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 {
            font-family: 'Rye', serif;
            font-weight: 400;
            color: var(--ink);
            font-size: 30px;
            margin-bottom: 20px;
        }
        p {
            color: #4A3A28;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .donate-btn {
            display: inline-block;
            background: var(--rust);
            color: #ffffff;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s ease;
        }
        .donate-btn:hover {
            background: var(--rust-bright);
        }
    </style>
</head>
<body class="page-donation">

    <!-- SITE NAVIGATION HEADER -->
    <nav class="site-nav" aria-label="Global">
        <div class="site-nav-inner">
            <a href="index.html" class="site-nav-brand">KHGN Inc.</a>
            <button class="site-nav-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
                <span class="site-nav-toggle-bar"></span>
                <span class="site-nav-toggle-bar"></span>
                <span class="site-nav-toggle-bar"></span>
            </button>
            <div class="site-nav-links">
                <a href="index.html">Home</a>
                <a href="socialmedia.html">Social Media</a>
                <a href="recruiting.html">Volunteer Recruitment</a>
                <a href="donation-portal.html">Donation Portal</a>
                <a href="training.html">Volunteer Training</a>
                <a href="game-portal.html">Game Portal</a>
            </div>
        </div>
    </nav>

    <div class="content-container">
        <h1>Support KHGN Inc.</h1>
        <p>
            Your contributions directly fund our network operations, community programs, and digital infrastructure. Thank you for your continued support and generosity!
        </p>
        <a href="https://www.paypal.com/donate/?hosted_button_id=9NEUHLZYAFPB2" target="_blank" class="donate-btn">Donate with PayPal</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const nav = document.querySelector(".site-nav");
            const toggle = document.querySelector(".site-nav-toggle");
            const links = document.querySelector(".site-nav-links");
            if (!nav || !toggle || !links) {
                return;
            }
            toggle.addEventListener("click", function () {
                const isOpen = nav.classList.toggle("is-open");
                toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            });
            links.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function () {
                    nav.classList.remove("is-open");
                    toggle.setAttribute("aria-expanded", "false");
                });
            });
        });
    </script>

</body>
</html>
