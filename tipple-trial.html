1: `# Understanding Personally Identifiable Information
### A Field Guide for KHGN Volunteers, Moderators, and Field Workers

*Level 1 Reading — Kentucky History & Genealogy Network, Inc.*

---

## Why This Matters Before You Touch a Single Record

Genealogy is, at its heart, an act of trust. Families trust researchers with letters, photographs, and stories they wouldn't hand to a stranger on the street. Communities trust historical societies to preserve the past without exposing the present. And KHGN, as an organization built entirely on volunteer labor, has staked its reputation on being a place where that trust is honored — not because a law requires it, but because it's the right way to treat people's lives.

Before you're trusted with moderation duties, field work, or any role that touches KHGN's records and social platforms, you need a working understanding of **Personally Identifiable Information**, commonly shortened to **PII**. This isn't a legal training course, and nothing here should be treated as formal legal advice — but it is a serious grounding in a topic that carries real consequences: for the people whose information is involved, and for KHGN's ability to keep doing this work at all.

By the end of this reading, you should be able to recognize PII when you see it, understand why the rules around *living* people differ sharply from the rules around the *deceased*, and know what to do when you spot a problem.

---

## Part One: What Is PII, Really?

At the simplest level, PII is any piece of information that can be used, on its own or combined with other details, to identify a specific living individual.

That definition is broader than most people expect. It's easy to picture PII as just the "big three" — Social Security numbers, home addresses, and phone numbers. Those absolutely count. But PII also includes things that feel harmless in isolation:

- A full name combined with a town or county
- An employer's name
- A date of birth or an approximate age
- A physical description or a recent photograph
- A relationship to another named, identifiable person
- An email address or a social media handle
- A vehicle, a license plate, or a home's physical appearance in a photo

The key insight is that **PII is often about combination, not just content**. A first name alone rarely identifies anyone. A first name, a hometown, and an employer, taken together, often will. This is why a post that "doesn't contain anything private" can still be a PII violation — the danger is in the assembly, not any single fact.

### A Simple Test

When you're unsure whether something counts as PII, ask:

> "If I were the person this information is about, could someone use this — alone or combined with a quick search — to find me, contact me, or learn something about my life that I haven't chosen to share?"

If the honest answer is yes, treat it as PII, even if no single detail feels alarming by itself.

---

## Part Two: The Living/Deceased Divide

This is the single most important distinction in genealogical PII work, and it's the one that trips up even experienced researchers.

**Privacy protections, as a general matter, exist to protect living people.** Once a person has died, most of the specific legal protections around their personal information no longer apply to them directly — this is part of why genealogy as a field is possible at all. Census records become public. Vital records become accessible. Historical letters can be published, studied, and shared.

But here is the trap: **genealogical records are rarely about only one person.** A record from 1975 might name a person who has since passed away — but the same record might also name their spouse, children, or witnesses who are very much alive today. A 1998 school photo of a person who died last year still shows other classmates who are living, working, and raising families right now.

**The rule of thumb KHGN volunteers should internalize:**

> Deceased status protects the deceased person's information. It does not extend that protection to any living person who appears in, or is connected to, the same record.

Every time you review a record, post, or photo, you should be asking two separate questions:
1. Who in this record is deceased?
2. Who in this record — named directly, pictured, or identifiable by relationship — might still be living?

If the answer to question two is "possibly," proceed as though it's PII until you can confirm otherwise.

---

## Part Three: PII That Doesn't Look Like PII

Some of the most common — and most easily missed — PII violations in genealogy work don't look like violations at all. They look like ordinary historical research. This section covers patterns you'll be tested on directly.

### 1. "Already Public" Isn't the Same as "Free to Redistribute"

A funeral home's obituary is public the moment it's posted — but it was made public *for a specific purpose*: to inform a community about a death and a memorial service. When that same obituary is copied wholesale into a searchable genealogy database, the calculus changes. The deceased person's information is no longer the concern — but the obituary likely lists **living survivors**: children, grandchildren, sometimes their current cities or even employers. Republishing all of that indefinitely, outside its original context, is where the real risk sits.

**The fix isn't to avoid obituaries.** It's to extract what's genealogically valuable (names, relationships, dates) and leave out details that only serve to locate or describe living relatives in the present day.

### 2. Cemetery Photography and the Blank Date

Headstones are about as "public record" as it gets — they sit outdoors, viewable by anyone who walks by. But companion or double headstones create a specific hazard: when one spouse has died and the other has not, it's common for the stone to already have the living spouse's name and birth year engraved, with the death date left blank.

That blank space is a signal. It tells you, and anyone else who sees the photo, that this named individual — with a **birth year, and therefore an approximate current age**, tied to a specific town — is very likely still alive. A photo that would be entirely unremarkable if both individuals were deceased becomes a live PII question the moment you notice that gap.

### 3. Identification Through Relationship, Not Direct Disclosure

Not every PII exposure involves a name-and-address pairing. Consider a simple research post: *"Looking for info on John Doe — he's the father of Jim Doe, and Jim Doe is my father."*

No address. No phone number. No photo. And yet this post identifies a specific living person (Jim Doe) as the poster's father, and by doing so, tells anyone reading that the poster has living siblings who share that same father — findable by anyone willing to do a small amount of cross-referencing.

This is **PII through inference**: identity and relationships revealed not by a direct fact, but by connecting stated relationships together. It's subtle, it's common in genealogy forums, and it's exactly the kind of thing moderators are trained to catch.

### 4. Records That Were Never Meant to Be Fully Public

Some documents *look* like harmless historical ephemera but actually carry protected information that stays sensitive for a person's entire lifetime. A military discharge form (a DD-214, for example) often includes a Social Security number and place of birth — and unlike a census record, it is not a public record, regardless of how old the paper itself looks. A decades-old benefits form or an old family document may carry the same risk. Age of the paper does not equal age of the protection; what matters is whether the person named is still alive and whether the specific data type (like an SSN) remains sensitive indefinitely.

### 5. DNA Results and Genetic Information

DNA match information deserves its own caution. A DNA match confirms a biological relationship — but sharing a match's name, employer, or social media profile "to help people verify the connection" shares far more than the genealogical fact itself. Genetic information about a living person is uniquely sensitive: it cannot be changed, it reveals information about relatives who never tested at all, and in some cases it touches on health information the person may not have chosen to disclose. When in doubt, share the *finding* (a confirmed relationship), not the *person's identifying details*.

### 6. Reunion Rosters, Sign-In Sheets, and "For Posterity" Scans

Family reunion sign-in sheets, class reunion rosters, and similar documents are often scanned "just for the archive" — but they frequently contain home addresses and phone numbers of people who are still alive and never expected that sign-in sheet to end up in a public research database.

### 7. Adoption and Birth-Parent Records

This category carries not just a privacy concern but a real ethical one. Surfacing the identity of a living birth parent or adoptee — even accurately, even with good intentions — before that person has consented to being found or contacted can cause serious harm and violate the trust that adoption reunion processes are built around. Treat any adoption-related identification as high-sensitivity by default, and escalate rather than post.

---

## Part Four: Your Role as a Moderator and Field Worker

Understanding PII isn't an academic exercise for KHGN volunteers — it's the foundation of the moderation and field-work responsibilities you're training toward. When you're reviewing posts in one of KHGN's community groups, or handling records at the county level, you are the last line of defense between a well-meaning member's post and a real person's unwanted exposure.

That means:

- **When in doubt, hold it back.** A post can always be approved after a quick edit. It's much harder to undo something that's already been shared widely.
- **Explain, don't just delete.** Most PII issues come from good intentions, not bad ones. Members respond better — and learn — when you explain *why* something needs to change, not just that it was removed.
- **Escalate what you're unsure about.** You are not expected to be a lawyer. If something feels like it might cross into legal territory (adoption records, active legal disputes, anything involving a minor), escalate to the Community Advisory Committee rather than guessing.
- **Remember the "why."** KHGN's mission depends on people trusting us with their families' stories. Every careful PII decision you make protects that trust — and, over time, protects KHGN's ability to keep growing and serving genealogy researchers across Kentucky and beyond.

---

## A Closing Thought

None of this is meant to make you afraid of genealogy work — quite the opposite. Most records, most photos, and most family stories carry no PII risk at all, especially once the people involved are gone and only history remains. The goal of this training isn't caution for its own sake; it's giving you the judgment to tell the difference between a story that's safe to share freely and one that needs a second look first.

When you're ready, continue to the Level 1 trail, where you'll apply everything in this reading to real-world scenarios.

---

*This material is intended for internal KHGN training purposes and reflects organizational best practices. It is not a substitute for formal legal advice. Questions about specific situations should be directed to the Community Advisory Committee.*`,

2: `# Understanding Copyright and Terms of Use
### A Field Guide for KHGN Volunteers, Moderators, and Field Workers

*Level 2 Reading — Kentucky History & Genealogy Network, Inc.*

> *"The only person who isn't required to cite their sources was Adam."*

---

## Why This Matters for a Genealogy Organization

Genealogy is a field built almost entirely on other people's work: transcriptions someone else painstakingly typed out, photographs someone else took or preserved, indexes someone else compiled, family trees someone else researched over years or decades. That's not a criticism — it's simply how the field functions. Nearly everything a researcher touches was created, gathered, or curated by somebody.

That reality is exactly why copyright and terms-of-use literacy matters so much for KHGN. Every time a volunteer shares a record, reposts a photo, or copies text into a forum thread, they're making a decision — often without realizing it — about whether that material is theirs to redistribute. Get it wrong often enough, and KHGN risks damaging relationships with the very archives, publishers, and fellow researchers whose cooperation the whole genealogy community depends on.

This reading isn't legal advice, and copyright law has real nuance that varies by country and by specific fact pattern. But by the end of it, you should be able to recognize the common patterns of copyright and terms-of-use violations well enough to catch them before they become a problem for KHGN.

---

## Part One: What Copyright Actually Protects

Copyright protects **original creative expression** — the specific way someone wrote, photographed, arranged, or presented something. It does not protect **facts** themselves.

This distinction matters enormously in genealogy work:

- A person's birth date, the fact that a marriage occurred, or the names on a census page are **facts**. Facts, by themselves, are not copyrightable.
- The specific **wording** of an article discussing that birth, a **photograph** of a gravestone, or a **transcription's particular formatting and annotations** can be copyrighted, because those involve someone's original creative or organizational effort.

The practical result: you can generally state that "John Smith was born in 1850 in Madison County" freely, because that's a fact. You cannot generally copy, word-for-word, someone else's article *about* John Smith's life, or their specific photograph of his headstone, without considering copyright.

---

## Part Two: Common Violation Patterns

### 1. Copying Full Text Instead of Summarizing
One of the most frequent mistakes is treating "I gave credit" as the same thing as "I had permission." Copying an entire article, blog post, or write-up — even with a source link at the bottom — usually goes well beyond what's legally protected as fair use for commentary or discussion. A tiny attribution link doesn't fix a full-text reproduction.

**The pattern to watch for:** long blocks of copied text, especially 1,000+ words lifted wholesale from somewhere else, with only a small citation. The fix is almost always to summarize the key facts in your own words and link to the original for anyone who wants the full piece.

### 2. Downloading and Re-Hosting Images
Finding an image online and downloading it to host directly on KHGN's own platform — rather than linking to where it lives — strips away the context (and often the copyright notice) the original creator attached to it. This applies to photographs, infographics, illustrations, and scanned documents alike. Even when there's no ill intent, re-hosting someone else's image as if it were freely available material is a common violation.

### 3. Removing Watermarks, Metadata, or Attribution
Stripping a creator's watermark, embedded metadata, or credit line before redistributing their work compounds a copyright issue into something closer to deliberate misattribution. This is true even if the person doing it genuinely believes the material is "probably fine to share" — removing identifying marks is itself a red flag that should trigger extra caution, not less.

### 4. Treating "License" as All-or-Nothing
Not everything online is either "fully copyrighted, don't touch" or "totally free, use however." Many creators publish under specific licenses — Creative Commons variants, for instance — that allow some uses but not others. A license that permits non-commercial sharing does not automatically permit commercial use, even if the material is otherwise freely viewable. Before reusing licensed material, check exactly what the license permits rather than assuming a license means "anything goes."

### 5. Open-Source Software and Attribution Requirements
This applies less to day-to-day genealogy posts and more to KHGN's technical side — but it's worth knowing. Open-source code libraries often come with license terms that require keeping the original license file and copyright notice intact in anything built using them. Deleting those files and re-publishing the resulting software as fully proprietary violates the license's terms, regardless of how much the code was modified.

### 6. Scraping and Bulk-Copying Content
Automatically or manually pulling large volumes of content — reviews, articles, photo galleries, compiled data — from other websites and republishing it natively (rather than linking out) is a pattern that shows up in commercial contexts but is worth recognizing in community platforms too. Bulk reproduction of someone else's compiled work, even when individual facts within it are public, can still infringe on the effort and originality of how that compilation was assembled.

### 7. Reproducing "Almost All" of a Source and Calling It Commentary
Fair use exists to protect genuine commentary, criticism, and analysis — but it has real limits tied to how much of the original was used and how transformative the new use is. Copying 90%, 95%, or more of someone else's proprietary writing or data, and adding only a thin layer of commentary on top, does not qualify as fair use no matter how the post is framed. If a "review" or "analysis" is mostly the original material with a light coat of paint, it's reproduction, not commentary.

### 8. Using Copyrighted Material Without Any Transformation
Reposting someone else's copyrighted content in full — a video, an image, a full article — without adding meaningful new commentary, analysis, or creative transformation generally fails the test that makes reuse legally defensible. The bar isn't "I said something before or after it" — it's whether the new post genuinely adds substantial original value rather than simply re-presenting the original work.

---

## Part Three: Terms of Use — A Different (But Related) Problem

Copyright law governs what you're legally allowed to do with someone's creative work. **Terms of use** are a separate, contractual layer — the rules a specific platform or website sets for how its content and services can be used, which you agree to (often without reading) when you use that platform.

This distinction matters because **content can be both copyright-compliant and still violate a platform's terms of use**, or vice versa. A few patterns specific to terms-of-use violations:

- **Bypassing paywalls or access restrictions.** Sharing a workaround, script, or method that lets people access paid or subscription-only content for free violates the platform's terms, separate from any copyright question about the content itself.
- **Violating a platform's stated redistribution rules**, even for content that might otherwise seem shareable. Many genealogy subscription sites, for instance, explicitly prohibit bulk downloading or redistributing their transcriptions and indexes, even though the underlying facts (names, dates) aren't copyrightable on their own. Their terms of service still bind anyone who created an account and agreed to them.
- **Automated scraping tools** that violate a site's explicit terms prohibiting automated access, even when the scraped content itself might not raise a separate copyright issue.

**The practical takeaway:** always consider two separate questions — "Do I have the right to use this content under copyright law?" and "Am I following the rules of the platform I got it from?" A post can fail either test independently.

---

## Part Four: Your Role as a Moderator and Field Worker

- **Summarize, don't reproduce.** When in doubt, describe what a source says in your own words and link to it, rather than copying the source's own text or images.
- **Check the license before assuming.** If material is labeled with a specific license (Creative Commons or otherwise), read what it actually permits rather than treating any license as a blanket "free to use."
- **Watch for stripped attribution.** A missing watermark, missing credit line, or missing source link on content that looks professionally made is worth a second look before it's approved.
- **Distinguish facts from expression.** Genealogical facts can be freely shared and restated. The specific writing, photography, or compiled presentation of those facts usually cannot be, without permission.
- **When something feels like "too much" copied material, it probably is.** There's no need to calculate an exact percentage — if a post is mostly someone else's original work with a thin layer of commentary on top, treat it as a likely violation and ask the poster to revise it.

---

## A Closing Thought

None of this is meant to make you afraid to reference other people's research — genealogy simply doesn't work without building on prior work. The goal is making sure KHGN builds on that work the right way: crediting it, linking to it, summarizing rather than reproducing it, and respecting the licenses and terms creators and platforms have set. Doing this consistently is what keeps KHGN in good standing with the archives, publishers, and fellow researchers this whole field depends on.

When you're ready, continue to the Level 2 trail, where the Teacher will walk you through real scenarios testing exactly this judgment.

---

*This material is intended for internal KHGN training purposes and reflects organizational best practices. It is not a substitute for formal legal advice. Questions about specific situations should be directed to the Community Advisory Committee.*`,

3: `# Understanding Legal Release Dates for Records
### A Field Guide for KHGN Volunteers, Moderators, and Field Workers

*Level 3 Reading — Kentucky History & Genealogy Network, Inc.*

---

## Why "Old" Doesn't Automatically Mean "Public"

One of the most persistent misunderstandings in genealogy work is the assumption that a record becomes fair game the moment it feels historical. A document from 1955 *feels* old. A court file from 1998 *feels* like ancient history to a researcher who's used to working with 19th-century census pages. But feeling old and being legally releasable are two entirely different things.

Governments and institutions set specific **release dates** — sometimes called embargo periods, restriction periods, or closure periods — for different categories of records. These dates exist for a reason: they balance the historical and genealogical value of a record against the privacy interests of the people named in it, many of whom may still be alive decades after the record was created.

As a KHGN volunteer, moderator, or field worker, your job isn't to memorize every jurisdiction's exact rule — that's genuinely difficult even for professionals, since rules vary by record type, by state, and sometimes by county. Your job is to recognize **when a record type is the kind that has a release date at all**, and to know to check before assuming a record is fair to share, publish, or index.

This reading is not a substitute for legal advice, and rules described here are general patterns, not guarantees for every jurisdiction. When in doubt, escalate to the Community Advisory Committee before publishing.

---

## Part One: Why Release Dates Exist

Release dates aren't bureaucratic red tape for its own sake. They reflect a real trade-off:

- **Too short a restriction period**, and living people's sensitive information (health details in death records, financial details in probate, family conflict in divorce filings) becomes exposed while they or their close family are still alive to be affected by it.
- **Too long a restriction period**, and legitimate historical and genealogical research is blocked long after any real privacy interest has faded.

Most record-keeping systems try to strike a balance by tying release to either a **fixed number of years after creation** or a **fixed number of years after the event** (like a person's death). Genealogists benefit enormously from this system once they understand it — but only if they respect the boundary while it's still in effect.

---

## Part Two: The Big Example — U.S. Federal Census Records

The most famous release-date rule in American genealogy is the **72-year rule** governing U.S. federal census records. Census records are sealed for 72 years from the date they were collected, specifically to protect the privacy of the individuals who answered detailed personal questions — such as income, health conditions, and household relationships — under a promise of confidentiality from the Census Bureau.

This means:

- As of any given year, only census records from **72 years and earlier** are publicly released.
- A researcher cannot access the "next" census release early, no matter how motivated, connected, or well-intentioned they are.
- Once released, census records become a cornerstone of genealogical research precisely because the waiting period has already resolved the privacy concern for the vast majority of people named in them.

The lesson for KHGN volunteers: **just because a nearby census year "feels" like it should be available doesn't mean it is.** Always confirm the actual most recently released census year rather than assuming based on how much time feels like it "should" have passed.

---

## Part Three: Vital Records — Births, Deaths, Marriages, and Divorces

Vital records are where release-date confusion causes the most real-world problems for genealogy volunteers, because **the rules vary significantly by state, and sometimes by the specific type of vital record.**

### Birth Records
Birth certificates are often the most tightly restricted vital record, because they can remain relevant to identity, inheritance, and even fraud prevention for a person's entire life. Many states restrict access to a birth record for **decades** after the birth — sometimes 75–100 years, sometimes tied to whether the person is confirmed deceased — precisely because the person named may still be alive and the record contains sensitive identifying details.

### Death Records
Death records are generally released sooner than birth records, since the core privacy concern (protecting a living person's data) is different once someone has died. However, many states still impose a waiting period — commonly in the range of 25–50 years — before death certificates become fully open to the public, partly because death records can include sensitive information about cause of death, and surviving family members may still be living.

### Marriage and Divorce Records
Marriage records are often released on a shorter timeline than birth or death records, since the core details (names, date, location) are less sensitive. Divorce records, however, frequently contain far more sensitive material — financial disputes, custody arrangements, allegations — and are often restricted longer or require special access procedures even after the "public" date has technically passed.

**The pattern to remember:** the more personally sensitive the content of a record type tends to be, the longer and stricter its typical release period — but the specific number of years is not universal, and Kentucky's rules may differ from a neighboring state's. Always verify the current rule for the specific state and record type rather than assuming a number from memory or from a different state's system.

---

## Part Four: Court, Legal, and Adoption Records

### General Court Records
Many civil and criminal court records become public relatively quickly, since court proceedings are often open by design. But **sealed records** — cases involving minors, certain family law matters, or cases a judge has specifically ordered sealed — remain closed regardless of how much time has passed, unless a court unseals them.

### Probate Records
Probate records (wills, estate settlements) are genealogically valuable and often become public on a shorter timeline than vital records, but can still contain sensitive financial and family details about living heirs.

### Adoption Records
Adoption records deserve special mention because they combine a **legal restriction** with a **serious ethical dimension**. In many jurisdictions, original birth certificates and adoption records remain sealed indefinitely, or are only unsealed through a specific legal process — sometimes requiring the consent of the parties involved, sometimes only through a court order, and sometimes never for older cases. Even where records have technically become accessible under evolving state laws, the underlying relationships often involve people who never consented to being found or identified. Treat any adoption-related record as high-sensitivity regardless of its formal release status, and escalate rather than publish independently.

### Military and Government Personnel Records
Some military records are surprisingly public once a servicemember is deceased and enough time has passed, while others — particularly those containing Social Security numbers or medical information — remain restricted regardless of age. As covered in Level 1's PII training, forms like the DD-214 are a common example of a document that "looks" historical but is not automatically public.

---

## Part Five: A Practical Framework for KHGN Volunteers

You are not expected to be a records-law expert. You are expected to follow a simple, repeatable process:

1. **Identify the record type.** Is this a census record, a birth/death/marriage/divorce record, a court file, a probate file, an adoption-related record, or a government personnel record? Each category has different rules.

2. **Ask whether a release date applies at all.** Not every record type has a waiting period — plenty of historical materials (newspapers, city directories, church records depending on the denomination's own policies) don't carry a government-imposed embargo. But when a record originates from a government vital-records office, court, or federal agency, assume a release date exists until you've confirmed otherwise.

3. **Check the current rule for the correct jurisdiction.** Don't assume a number you remember from a different state, a different record type, or an outdated source. Rules change over time as legislatures update them.

4. **When a record involves adoption, sealed court proceedings, or clearly sensitive personal history, treat it as restricted regardless of its formal age**, and escalate to the Community Advisory Committee rather than making the call solo.

5. **When in doubt, don't publish yet.** As with PII, it is far easier to release a record a little later, once confirmed, than to walk back a record that was shared prematurely.

---

## Part Six: Why This Matters Beyond Compliance

Every time KHGN correctly respects a record's release date, it reinforces something bigger than avoiding a technical violation: it protects the organization's credibility with the very institutions — county clerks, state archives, historical societies — that genealogy research depends on. Archives and record offices are far more willing to work cooperatively with organizations that have a demonstrated track record of handling records responsibly. A single embarrassing incident of publishing a record before its legal release date can damage relationships that took years to build.

Your careful judgment here isn't just about following a rule. It's about being the kind of organization that institutions trust enough to keep opening their doors to.

---

## A Closing Thought

Release dates can feel like an obstacle to good research, especially when a record you need sits just a few years on the wrong side of a waiting period. But these rules exist because someone, at some point, decided that a real person's privacy interest was worth protecting for a defined period of time — and that judgment deserves respect, even when it's inconvenient.

When you're ready, continue to the Level 3 trail, where you'll apply this framework to real-world scenarios involving the Scholar's specialty: knowing not just what a record says, but when it was truly meant to be seen.

---

*This material is intended for internal KHGN training purposes and reflects organizational best practices. It is not a substitute for formal legal advice. Rules described here vary by jurisdiction and record type and may change over time. Questions about specific records should be directed to the Community Advisory Committee.*`,

4: `# Understanding Inurement and Private Gain
### A Field Guide for KHGN Volunteers, Moderators, and Field Workers

*Level 4 Reading — Kentucky History & Genealogy Network, Inc.*

---

## Why This Level Exists

The first three levels of this training protect the people whose stories and records KHGN handles: the living relatives named in a post, the researchers whose work carries copyright, the individuals whose records aren't legally releasable yet. This level protects something different — the organization itself, and the public trust it was built on.

KHGN is a nonprofit. That single fact carries real legal weight. In exchange for tax-exempt status, favorable treatment, and the public's willingness to donate time and money, a nonprofit makes an implicit promise: **its resources, its name, and its opportunities exist to serve its stated public mission — not to enrich any individual connected to it.**

When that promise is broken, the legal term for it is **inurement** — allowing the organization's net earnings or resources to benefit a private individual. A closely related concept is **private benefit** — using the organization's platform, reputation, or assets to advantage someone personally or commercially, even without a direct transfer of money. Both are treated seriously by nonprofit law, because both threaten the fundamental bargain a 501(c)(3) organization makes with the public.

This reading is general education, not legal advice. If you ever suspect an actual inurement or private-benefit situation is happening — not just a training scenario — that's a matter for the Board and the Community Advisory Committee, not something to handle informally.

---

## Part One: What Inurement Actually Means

"Inurement" sounds like dense legal jargon, but the underlying idea is simple: **no part of a nonprofit's net earnings may benefit a private individual, especially someone considered an "insider"** — a board member, officer, key employee, major donor, or someone closely connected to any of them.

This doesn't mean nonprofits can't pay anyone. Reasonable compensation for real work, reimbursement for actual expenses, and legitimate vendor payments are all normal and lawful. The problem arises when the benefit is:

- **Disproportionate** to any real service provided
- **Not available on the same terms to the general public or membership**
- **Tied to someone's insider position** rather than to a fair transaction

The classic historical example is a nonprofit whose founder pays himself an enormous, unjustified salary, or whose board quietly awards contracts to companies owned by board members' relatives at inflated prices. But inurement in a modern volunteer organization is often much smaller and much less dramatic than that — which is exactly why it's easy to miss.

---

## Part Two: What This Looks Like in a Volunteer Organization Like KHGN

You don't need a corporate embezzlement scheme to have an inurement problem. Some patterns that are far more common — and far easier for a volunteer to stumble into without bad intent:

### 1. Using the Organization's Platform for Personal Business
A board member or volunteer with administrative access to KHGN's social media groups, forums, or mailing lists uses that access to promote their own private business — a professional genealogy research service, a photography studio, a travel agency, a self-published book — under the appearance of an official KHGN announcement. Even if the person genuinely believes they're just "sharing something useful with the community," this uses an asset that belongs to the organization (its audience, its credibility, its platform) for private commercial gain.

### 2. Steering Organizational Opportunities to Oneself or Family
If KHGN needs a service — printing, web design, event catering, research assistance — and a volunteer or board member arranges for the contract to go to their own business, or a close relative's business, without the same open comparison given to other options, that's a private-benefit concern, regardless of whether the price was technically "fair."

### 3. Using Donor or Membership Data for Personal Advantage
Contact lists, donor records, and volunteer databases exist to serve KHGN's mission. Using that same list to promote a personal side business, solicit customers, or advance a private project is a misuse of an organizational asset, separate from — but often overlapping with — the PII concerns covered in Level 1.

### 4. Accepting Personal Perks Tied to Organizational Position
If a volunteer's access to historical archives, county records, or KHGN's reputation is used to negotiate personal deals, discounts, or opportunities that wouldn't be available to them as a private citizen, that's a private benefit flowing from an organizational role.

### 5. Blurring Personal and Organizational Fundraising
Soliciting donations "for KHGN" that are actually directed toward a volunteer's personal expenses, a side project not authorized by the Board, or an unrelated cause is a serious inurement and trust violation — even when the underlying cause seems sympathetic.

---

## Part Three: Why "I Wasn't Trying to Cheat Anyone" Isn't the Test

Most real-world inurement problems in small nonprofits don't come from someone twirling a mustache and plotting to loot the treasury. They come from people who see an opportunity that feels harmless — "I'll just mention my business, it's relevant to the group anyway" — and don't stop to separate their personal interest from the organization's.

The legal and ethical test isn't whether someone *intended* harm. It's whether:

1. **An insider received a benefit** (money, opportunity, access, promotion) **connected to their position**, and
2. **That benefit wasn't available on equal terms to others**, or **wasn't a fair exchange for value actually provided.**

If both are true, it's an inurement or private-benefit concern — regardless of good intentions.

---

## Part Four: What's at Stake

For an organization, sustained or serious inurement violations can jeopardize **tax-exempt status itself** — the IRS can revoke a 501(c)(3)'s exemption for inurement violations, and in more serious cases, insiders who benefited improperly can face personal excise-tax penalties under what's known as "intermediate sanctions."

But beyond the legal exposure, there's something more immediate for an organization like KHGN: **donor and volunteer trust**. People give their time, their family records, and sometimes their money to KHGN because they believe it exists to serve Kentucky's genealogical and historical community — not to serve any individual's private interests. A single visible incident of a board member or volunteer using KHGN's platform for personal gain can do lasting damage to that trust, even if it's resolved quickly.

---

## Part Five: What to Do If You See This Happening

As with the earlier levels, your job as a moderator or field worker isn't to be the final legal judge — it's to recognize the pattern and route it correctly.

1. **Recognize the pattern**: an insider benefiting personally, commercially, or reputationally through their KHGN access or position.
2. **Don't confront it publicly or informally as a personal accusation.** This is a governance matter, not a moderation call you should make solo.
3. **Escalate to the Community Advisory Committee**, who can bring it to the Board — the only body with the authority to review, decide, and act on matters like this, per KHGN's governance structure.
4. **Document what you observed factually**, without speculating about motive. What was posted, by whom, when, and what personal benefit it appeared to provide.

---

## A Closing Thought

This level exists to protect something you can't see in any single post the way you can see a PII violation or a copyright infringement — the long-term integrity of the organization every other level exists to serve. Every dollar, every volunteer hour, and every piece of community trust that KHGN holds is held *for* the mission, not for any one person's benefit — including yours, if you ever find yourself in a position where the line gets blurry.

When you're ready, continue to the Level 4 trail, where the Village Court Clerk will walk you through real scenarios testing exactly this judgment.

---

*This material is intended for internal KHGN training purposes and reflects organizational best practices. It is not a substitute for formal legal advice. Questions about specific situations should be directed to the Community Advisory Committee and, where appropriate, the Board.*`

/* ---------- Lightweight Markdown renderer (headers, bold/italic, lists, blockquotes, rules) ---------- */
function renderMarkdown(md){
  const lines = md.split('\n');
  let html = '';
  let listBuffer = [];
  let listType = null;
  function flushList(){
    if(listBuffer.length){
      html += `<${listType}>` + listBuffer.map(li => `<li>${li}</li>`).join('') + `</${listType}>`;
      listBuffer = [];
      listType = null;
    }
  }
  function inline(text){
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }
  lines.forEach(raw => {
    const line = raw.trim();
    if(line === ''){ flushList(); return; }
    if(line === '---'){ flushList(); html += '<hr>'; return; }
    let m;
    if((m = line.match(/^### (.*)/))){ flushList(); html += `<h4>${inline(m[1])}</h4>`; return; }
    if((m = line.match(/^## (.*)/))){ flushList(); html += `<h3>${inline(m[1])}</h3>`; return; }
    if((m = line.match(/^# (.*)/))){ flushList(); html += `<h2>${inline(m[1])}</h2>`; return; }
    if((m = line.match(/^> (.*)/))){ flushList(); html += `<blockquote>${inline(m[1])}</blockquote>`; return; }
    if((m = line.match(/^- (.*)/))){ if(listType !== 'ul'){ flushList(); listType = 'ul'; } listBuffer.push(inline(m[1])); return; }
    if((m = line.match(/^\d+\.\s(.*)/))){ if(listType !== 'ol'){ flushList(); listType = 'ol'; } listBuffer.push(inline(m[1])); return; }
    flushList();
    html += `<p>${inline(line)}</p>`;
  });
  flushList();
  return html;
}

    questions: [{

    questions: [{
      prompt: "What borderline commercial 'gotcha' has been triggered by this service offer?",
      options: [

        "Members are fully permitted to run private print shops as long as the initial design labor is labeled as voluntary.",

      ], correct: 0
    }]

LEVEL4_QUIZZES.push(...LEVEL4_QUIZZES_PART2);

/* ---------- Level construction ---------- */
const LEVELS = [
  {
    id: 1,
    topic: "Personally Identifiable Information",
    guideName: "The Village Elder",
    guideRole: "Trail Guide",
    guideSvg: ELDER_SVG,
    introText: `"Before you carry another family's story forward, you must learn to carry it carefully. What you're about to guard is called Personally Identifiable Information — PII, for short. It's any detail that can point back to a real, living person: a name paired with an address, a phone number, a workplace, a face in a recent photo tagged with a location. Our ancestors' stories are meant to be shared. The people still walking among us deserve a say in how their own details travel. Answer true, and you'll earn your place watching over these records. Answer false, and I'm afraid the Sheriff will have a word with you."`,
    quizzes: LEVEL1_QUIZZES
  },
  {
    id: 2,
    topic: "Copyright & Terms of Use",
    guideName: "The Teacher",
    guideRole: "Trail Guide",
    guideSvg: TEACHER_SVG,
    introText: `"Welcome to the schoolhouse. Here we study a different kind of trust: the trust between a researcher and the work of others. Old records, transcriptions, photographs, and even other researchers' family trees can carry copyright or terms-of-use restrictions. Reusing them without permission — even with good intentions — can cause real harm to the people and institutions who preserved them. Twelve lessons await. Study well." `,
    quizzes: LEVEL2_QUIZZES
  },
  {
    id: 3,
    topic: "Legal Release Dates for Records",
    guideName: "The Scholar",
    guideRole: "Trail Guide",
    guideSvg: SCHOLAR_SVG,
    introText: `"Every record has its season. Census records, vital records, and court files each become public at different times — some after decades, some sooner, some not at all without special permission. Sharing a record before its legal release date isn't just a technicality; it can violate real privacy law. Let us study the calendar of records together."`,
    quizzes: LEVEL3_QUIZZES
  },
  {
    id: 4,
    topic: "Inurement & Commercial/Personal Gain",
    guideName: "The Village Court Clerk",
    guideRole: "Trail Guide",
    guideSvg: CLERK_SVG,
    introText: `"Step into my office. As a nonprofit, KHGN's resources, records, and volunteer labor exist for the public benefit — not for the private gain of any one person, however well-connected. Using our platform, our data, or our name for personal or commercial advantage is called inurement, and it can jeopardize the organization's entire nonprofit status. Let's make sure every trainee understands exactly where that line sits."`,
    quizzes: LEVEL4_QUIZZES
  }
];

/* ---------- State ---------- */
let currentLevelIdx = 0;
let currentStop = 0; // 0 = intro
let quizAnswers = {}; // keyed by `${levelIdx}-${stop}`
let unlockedLevels = [true, false, false, false];
let gateUnlocked = [false, false, false, false]; // has the reading gate been passed for this level?
let gateTimerInterval = null;
let gateElapsedSeconds = 0;
let gateScrolledToEnd = false;

function levelKey(stop){ return currentLevelIdx + '-' + stop; }

function renderLevelTabs(){
  const wrap = document.getElementById('level-tabs');
  wrap.innerHTML = '';
  LEVELS.forEach((lvl, i) => {
    const tab = document.createElement('div');
    tab.className = 'level-tab' + (i === currentLevelIdx ? ' active' : '') + (!unlockedLevels[i] ? ' locked' : '');
    tab.innerHTML = `<div class="lt-num">LEVEL ${lvl.id}${unlockedLevels[i] ? '' : ' · LOCKED'}</div>
      <div class="lt-name">${lvl.guideName}</div>
      <div class="lt-topic">${lvl.topic}</div>`;
    if(unlockedLevels[i]){
      tab.onclick = () => { currentLevelIdx = i; currentStop = 0; render(); };
    }
    wrap.appendChild(tab);
  });
}

function renderTrail(){
  const trail = document.getElementById('trail');
  trail.innerHTML = '';
  const line = document.createElement('div'); line.className = 'trail-line'; trail.appendChild(line);
  const fill = document.createElement('div'); fill.className = 'trail-line-fill';
  const pct = currentStop === 0 ? 0 : ((currentStop-1) / (TOTAL_STOPS-1)) * 100;
  fill.style.width = pct + '%';
  trail.appendChild(fill);
  const quizzes = LEVELS[currentLevelIdx].quizzes;
  for(let i=1;i<=TOTAL_STOPS;i++){
    const stop = document.createElement('div');
    stop.className = 'stop';
    if(i < currentStop) stop.classList.add('done');
    if(i === currentStop) stop.classList.add('current');
    const dot = document.createElement('div'); dot.className = 'stop-dot';
    dot.textContent = i < currentStop ? '✓' : i;
    const label = document.createElement('div'); label.className = 'stop-label';
    label.textContent = i <= quizzes.length ? 'Stop '+i : '';
    stop.appendChild(dot); stop.appendChild(label);
    trail.appendChild(stop);
  }
}

function resetLevel(){
  currentStop = 0;
  render();
}

function startLevel(){
  currentStop = 1;
  render();
}

function renderIntro(){
  const lvl = LEVELS[currentLevelIdx];
  return `
  <div class="card">
    <div class="character-row">
      <div class="portrait">${lvl.guideSvg}</div>
      <div class="char-meta">
        <p class="char-name">${lvl.guideName}</p>
        <p class="char-role">${lvl.guideRole} · Level ${lvl.id}: ${lvl.topic}</p>
        <button class="narration-btn" onclick="playNarration('level${lvl.id}-intro')">▶ Play narration</button>
      </div>
    </div>
    <p class="body-text">${lvl.introText}</p>
    <button class="primary-btn" onclick="startLevel()">Begin the Trail</button>
  </div>
  <div class="footer-note" style="margin-top:14px;">
    Staff note: replace playNarration() with your recorded voiceover audio file per character.
  </div>`;
}

function renderQuiz(stopIndex){
  const lvl = LEVELS[currentLevelIdx];
  const quiz = lvl.quizzes[stopIndex-1];
  if(!quiz){
    return `<div class="card"><p class="body-text">Level ${lvl.id} (${lvl.topic}) — Waypoint ${stopIndex} content is still being written. Add it to that level's quizzes array in the code.</p>
    <button class="primary-btn" onclick="advanceAfterPass()">Skip for now (prototype only)</button></div>`;
  }
  const key = levelKey(stopIndex);
  const answered = quizAnswers[key] !== undefined;
  let html = `
  <div class="card">
    <div class="character-row">
      <div class="portrait">${lvl.guideSvg}</div>
      <div class="char-meta">
        <p class="char-name">${quiz.title}</p>
        <p class="char-role">Level ${lvl.id} · Trail Stop ${stopIndex} of ${TOTAL_STOPS}</p>
      </div>
    </div>
    ${quiz.gotcha ? '<span class="gotcha-badge">⚠ BORDERLINE CASE</span>' : ''}
    <div class="scenario-box">${quiz.scenario}</div>
  `;

  quiz.questions.forEach((q, qi) => {
    const picked = quizAnswers[key]?.[qi];
    html += `<div class="question-block">
      <div class="q-num">QUESTION ${qi+1} OF ${quiz.questions.length}</div>
      <p class="q-prompt">${q.prompt}</p>
      <div class="options">`;
    q.options.forEach((opt, oi) => {
      let cls = 'option';
      if(answered){
        if(oi === q.correct) cls += ' correct';
        else if(oi === picked) cls += ' incorrect';
      } else if(picked === oi){
        cls += ' selected';
      }
      html += `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="selectAnswer(${stopIndex},${qi},${oi})">${opt}</button>`;
    });
    html += `</div></div>`;
  });

  if(!answered){
    const allPicked = quiz.questions.every((_,qi) => quizAnswers[key]?.[qi] !== undefined);
    html += `<button class="primary-btn" ${allPicked ? '' : 'disabled'} onclick="submitQuiz(${stopIndex})">Submit Answers</button>`;
  } else {
    const numCorrect = quiz.questions.filter((q,qi) => quizAnswers[key][qi] === q.correct).length;
    const passed = numCorrect === quiz.questions.length;
    if(passed){
      const isLast = stopIndex === TOTAL_STOPS;
      html += `<div class="feedback-banner pass">✓ All correct — the trail continues.</div>
      <button class="primary-btn" onclick="advanceAfterPass()">${isLast ? 'Finish Level ' + lvl.id : 'Continue to Stop ' + (stopIndex+1)}</button>`;
    } else {
      html += `<div class="feedback-banner fail">⚠ ${quiz.questions.length - numCorrect} answer(s) missed. The Sheriff would like a word.</div>
      <button class="primary-btn" onclick="goToSheriff(${stopIndex})">Face the Sheriff</button>`;
    }
  }

  html += `</div>`;
  return html;
}

function renderSheriff(stopIndex){
  const lvl = LEVELS[currentLevelIdx];
  const quiz = lvl.quizzes[stopIndex-1];
  const key = levelKey(stopIndex);
  const missedIndex = quiz.questions.findIndex((q,qi) => quizAnswers[key][qi] !== q.correct);
  const q = quiz.questions[missedIndex];

  return `
  <div class="card sheriff">
    <div class="character-row">
      <div class="portrait">${SHERIFF_SVG}</div>
      <div class="char-meta">
        <p class="char-name">The Sheriff</p>
        <p class="char-role">Compliance &amp; Consequences</p>
        <button class="narration-btn" onclick="playNarration('sheriff-L${lvl.id}-'+stopIndex)">▶ Play narration</button>
      </div>
    </div>
    <p class="body-text">
      "Hold on now. What you just approved would've caused real harm — this is exactly the kind of
      mistake that damages trust, exposes people to risk, and puts this organization's credibility
      on the line. I'm going to give you one more chance to get it right. Answer true this time, and
      you'll walk on. Answer false, and you're headed back to the start of this level."
    </p>
    <div class="final-question">
      <div class="q-num">FINAL CHANCE</div>
      <p class="q-prompt">${q.prompt}</p>
      <div class="options" id="final-options">
        ${q.options.map((opt,oi) => `<button class="option" onclick="answerFinal(${stopIndex},${missedIndex},${oi})">${opt}</button>`).join('')}
      </div>
    </div>
    <div id="final-result"></div>
  </div>`;
}

function renderLevelComplete(){
  const lvl = LEVELS[currentLevelIdx];
  const isLastLevel = currentLevelIdx === LEVELS.length - 1;
  let html = `
  <div class="card complete-screen ${isLastLevel ? 'program-complete' : ''}">
    <div class="badge">${isLastLevel ? '🏆' : '🏅'}</div>
    <p class="char-name" style="font-size:26px;">${isLastLevel ? 'Program Complete' : 'Level ' + lvl.id + ' Complete'}</p>
    <p class="body-text">
      ${isLastLevel
        ? `You've cleared all four levels of KHGN Field Training. You're now eligible for the Community Advisory Committee's field-worker track.`
        : `You've cleared all ${TOTAL_STOPS} waypoints of ${lvl.topic}. Level ${lvl.id + 1}: ${LEVELS[currentLevelIdx+1].topic} awaits.`}
    </p>`;
  if(isLastLevel){
    html += `<div id="volunteer-form-hook">KHGN staff: embed your volunteer sign-up / contact form here.</div>`;
  } else {
    html += `<button class="primary-btn" onclick="goToNextLevel()">Continue to Level ${lvl.id + 1}</button>`;
  }
  html += `<button class="secondary-btn" onclick="resetLevel()">Replay This Level</button></div>`;
  return html;
}

function renderGate(){
  const lvl = LEVELS[currentLevelIdx];
  const articleHtml = renderMarkdown(ARTICLES[lvl.id] || '');
  return `
  <div class="card">
    <div class="character-row">
      <div class="portrait">${lvl.guideSvg}</div>
      <div class="char-meta">
        <p class="char-name">Required Reading</p>
        <p class="char-role">Level ${lvl.id}: ${lvl.topic}</p>
      </div>
    </div>
    <div class="article-content" id="article-scroll" onscroll="checkArticleScroll()">
      ${articleHtml}
    </div>
    <div class="gate-status">
      <div class="gate-row" id="scroll-indicator">○ Scroll to the end of the reading</div>
      <div class="gate-row" id="timer-indicator">○ Reading time: 00:00 / ${String(Math.floor(MIN_READ_SECONDS/60)).padStart(2,'0')}:00</div>
    </div>
    <button class="primary-btn" id="gate-continue-btn" disabled onclick="passGate()">Continue to the Trail</button>
  </div>`;
}

function startGateTimer(){
  clearGateTimer();
  gateElapsedSeconds = 0;
  gateScrolledToEnd = false;
  updateGateStatus();
  gateTimerInterval = setInterval(() => {
    gateElapsedSeconds++;
    updateGateStatus();
  }, 1000);
}

function clearGateTimer(){
  if(gateTimerInterval){ clearInterval(gateTimerInterval); gateTimerInterval = null; }
}

function checkArticleScroll(){
  const el = document.getElementById('article-scroll');
  if(!el) return;
  if(el.scrollTop + el.clientHeight >= el.scrollHeight - 20){
    gateScrolledToEnd = true;
  }
  updateGateStatus();
}

function updateGateStatus(){
  const scrollEl = document.getElementById('scroll-indicator');
  const timerEl = document.getElementById('timer-indicator');
  const btn = document.getElementById('gate-continue-btn');
  if(!scrollEl || !timerEl) return; // screen has moved on
  scrollEl.textContent = (gateScrolledToEnd ? '✓' : '○') + ' Scroll to the end of the reading';
  scrollEl.classList.toggle('gate-done', gateScrolledToEnd);
  const mm = String(Math.floor(gateElapsedSeconds/60)).padStart(2,'0');
  const ss = String(gateElapsedSeconds%60).padStart(2,'0');
  const totalMin = String(Math.floor(MIN_READ_SECONDS/60)).padStart(2,'0');
  const timeDone = gateElapsedSeconds >= MIN_READ_SECONDS;
  timerEl.textContent = (timeDone ? '✓' : '○') + ` Reading time: ${mm}:${ss} / ${totalMin}:00`;
  timerEl.classList.toggle('gate-done', timeDone);
  if(btn) btn.disabled = !(gateScrolledToEnd && timeDone);
}

function passGate(){
  clearGateTimer();
  gateUnlocked[currentLevelIdx] = true;
  currentStop = 0;
  render();
}

function render(){
  renderLevelTabs();
  const stage = document.getElementById('stage');
  const trailWrap = document.getElementById('trail-wrap');
  const lvl = LEVELS[currentLevelIdx];

  if(!gateUnlocked[currentLevelIdx]){
    trailWrap.style.display = 'none';
    stage.innerHTML = renderGate();
    startGateTimer();
    return;
  }
  clearGateTimer();
  trailWrap.style.display = '';

  renderTrail();
  if(currentStop === 0){
    stage.innerHTML = renderIntro();
  } else if(currentStop <= TOTAL_STOPS){
    stage.innerHTML = renderQuiz(currentStop);
  } else {
    stage.innerHTML = renderLevelComplete();
  }
}

function selectAnswer(stopIndex, qIndex, optIndex){
  const key = levelKey(stopIndex);
  if(!quizAnswers[key]) quizAnswers[key] = {};
  quizAnswers[key][qIndex] = optIndex;
  render();
}

function submitQuiz(stopIndex){ render(); }

function advanceAfterPass(){
  currentStop += 1;
  render();
}

function goToSheriff(stopIndex){
  document.getElementById('stage').innerHTML = renderSheriff(stopIndex);
}

function answerFinal(stopIndex, questionIndex, chosenIndex){
  const lvl = LEVELS[currentLevelIdx];
  const quiz = lvl.quizzes[stopIndex-1];
  const q = quiz.questions[questionIndex];
  const resultDiv = document.getElementById('final-result');
  const buttons = document.querySelectorAll('#final-options .option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if(i === q.correct) btn.classList.add('correct');
    else if(i === chosenIndex) btn.classList.add('incorrect');
  });
  if(chosenIndex === q.correct){
    const isLast = stopIndex === TOTAL_STOPS;
    resultDiv.innerHTML = `<div class="feedback-banner pass" style="margin-top:14px;">✓ Corrected. The Sheriff nods and steps aside.</div>
    <button class="primary-btn" onclick="advanceAfterPass()">${isLast ? 'Finish Level ' + lvl.id : 'Continue to Stop ' + (stopIndex+1)}</button>`;
  } else {
    resultDiv.innerHTML = `<div class="feedback-banner fail" style="margin-top:14px;">✗ Still not right. Back to the start of this level.</div>
    <button class="primary-btn" onclick="resetLevel()">Return to Trailhead</button>`;
  }
}

function goToNextLevel(){
  unlockedLevels[currentLevelIdx+1] = true;
  currentLevelIdx += 1;
  currentStop = 0;
  render();
}

function playNarration(clipId){
  alert('Placeholder: wire this button to your recorded voiceover file for "' + clipId + '".');
}

render();
</script>
