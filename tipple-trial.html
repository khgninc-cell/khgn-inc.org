<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tipple Trial - KHGN Game Portal</title>
    <!-- Link to your existing main stylesheet if applicable, or embed custom arcade styles -->
    <link rel="stylesheet" href="index.html"> <!-- Or link to main CSS if separated -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        header a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        header a:hover {
            text-decoration: underline;
        }
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .game-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .game-header h1 {
            font-size: 2rem;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }
        .game-header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        /* GDevelop Canvas Frame Wrapper */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .canvas-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div><strong>KHGN Inc.</strong> &mdash; Training Module</div>
        <div>
            <a href="game-portal.html">&larr; Back to Game Portal</a>
        </div>
    </header>

    <main class="game-container">
        <div class="game-header">
            <h1>The Tipple Trial</h1>
            <p>Compliance Training: PII, Copyright, Terms of Use, and Local Release Dates</p>
        </div>

        <!-- 
          If you host your GDevelop export files in a subfolder (e.g., /games/tipple-trial/), 
          point the iframe source directly to that folder's index.html:
        -->
        <div class="canvas-wrapper">
            <iframe src="games/tipple-trial/index.html" allowfullscreen></iframe>
        </div>
    </main>

</body>
</html>
